<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/></filter></defs>
<rect x="0.5" y="0.5" width="719" height="411" rx="10" ry="10" fill="#fafafa" stroke="#cfd8dc" stroke-width="1" filter="url(#shadow)"/>
<path d="M 10 0.5 L 710 0.5 Q 719.5 0.5 719.5 10 L 719.5 38 L 0.5 38 L 0.5 10 Q 0.5 0.5 10 0.5 Z" fill="#ffffff"/>
<line x1="0" y1="38" x2="720" y2="38" stroke="#cfd8dc" stroke-width="1"/>
<circle cx="20" cy="19" r="6" fill="#ff5f57"/>
<circle cx="40" cy="19" r="6" fill="#febc2e"/>
<circle cx="60" cy="19" r="6" fill="#28c840"/>
<text x="360" y="23" font-size="12" fill="#90a4ae" text-anchor="middle">top_customers.sql</text>
<text x="52" y="70" font-size="14" fill="#90a4ae" text-anchor="end">1</text>
<text x="66" y="70" font-size="14" xml:space="preserve"><tspan fill="#90a4ae" font-style="italic">-- Top 10 customers by revenue in the last 30 days</tspan></text>
<text x="52" y="92" font-size="14" fill="#90a4ae" text-anchor="end">2</text>
<text x="66" y="92" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">SELECT</tspan></text>
<text x="52" y="114" font-size="14" fill="#90a4ae" text-anchor="end">3</text>
<text x="66" y="114" font-size="14" xml:space="preserve"><tspan fill="#2c3e50">    </tspan><tspan fill="#558b2f">c</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">id</tspan><tspan fill="#2c3e50">            </tspan><tspan fill="#7b1fa2">AS</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">customer_id</tspan><tspan fill="#0288d1">,</tspan></text>
<text x="52" y="136" font-size="14" fill="#90a4ae" text-anchor="end">4</text>
<text x="66" y="136" font-size="14" xml:space="preserve"><tspan fill="#2c3e50">    </tspan><tspan fill="#558b2f">c</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">name</tspan><tspan fill="#2c3e50">          </tspan><tspan fill="#7b1fa2">AS</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">customer_name</tspan><tspan fill="#0288d1">,</tspan></text>
<text x="52" y="158" font-size="14" fill="#90a4ae" text-anchor="end">5</text>
<text x="66" y="158" font-size="14" xml:space="preserve"><tspan fill="#2c3e50">    </tspan><tspan fill="#c9851a">COUNT</tspan><tspan fill="#0288d1">(</tspan><tspan fill="#558b2f">o</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">id</tspan><tspan fill="#0288d1">)</tspan><tspan fill="#2c3e50">     </tspan><tspan fill="#7b1fa2">AS</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">order_count</tspan><tspan fill="#0288d1">,</tspan></text>
<text x="52" y="180" font-size="14" fill="#90a4ae" text-anchor="end">6</text>
<text x="66" y="180" font-size="14" xml:space="preserve"><tspan fill="#2c3e50">    </tspan><tspan fill="#c9851a">SUM</tspan><tspan fill="#0288d1">(</tspan><tspan fill="#558b2f">o</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">total</tspan><tspan fill="#0288d1">)</tspan><tspan fill="#2c3e50">    </tspan><tspan fill="#7b1fa2">AS</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">revenue</tspan><tspan fill="#0288d1">,</tspan></text>
<text x="52" y="202" font-size="14" fill="#90a4ae" text-anchor="end">7</text>
<text x="66" y="202" font-size="14" xml:space="preserve"><tspan fill="#2c3e50">    </tspan><tspan fill="#c9851a">AVG</tspan><tspan fill="#0288d1">(</tspan><tspan fill="#558b2f">o</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">total</tspan><tspan fill="#0288d1">)</tspan><tspan fill="#2c3e50">    </tspan><tspan fill="#7b1fa2">AS</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">avg_order_value</tspan></text>
<text x="52" y="224" font-size="14" fill="#90a4ae" text-anchor="end">8</text>
<text x="66" y="224" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">FROM</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#c9851a">customers</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">c</tspan></text>
<text x="52" y="246" font-size="14" fill="#90a4ae" text-anchor="end">9</text>
<text x="66" y="246" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">INNER JOIN</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#c9851a">orders</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">o</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#7b1fa2">ON</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">o</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">customer_id</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#0288d1">=</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">c</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">id</tspan></text>
<text x="52" y="268" font-size="14" fill="#90a4ae" text-anchor="end">10</text>
<text x="66" y="268" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">WHERE</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">o</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">created_at</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#0288d1">&gt;=</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#c9851a">NOW</tspan><tspan fill="#0288d1">(</tspan><tspan fill="#0288d1">)</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#0288d1">-</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#7b1fa2" font-style="italic">INTERVAL</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">'30 days'</tspan></text>
<text x="52" y="290" font-size="14" fill="#90a4ae" text-anchor="end">11</text>
<text x="66" y="290" font-size="14" xml:space="preserve"><tspan fill="#2c3e50">  </tspan><tspan fill="#7b1fa2">AND</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">o</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">status</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#7b1fa2">NOT IN</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#0288d1">(</tspan><tspan fill="#558b2f">'cancelled'</tspan><tspan fill="#0288d1">,</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">'refunded'</tspan><tspan fill="#0288d1">)</tspan></text>
<text x="52" y="312" font-size="14" fill="#90a4ae" text-anchor="end">12</text>
<text x="66" y="312" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">GROUP BY</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">c</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">id</tspan><tspan fill="#0288d1">,</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">c</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">name</tspan></text>
<text x="52" y="334" font-size="14" fill="#90a4ae" text-anchor="end">13</text>
<text x="66" y="334" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">HAVING</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#c9851a">SUM</tspan><tspan fill="#0288d1">(</tspan><tspan fill="#558b2f">o</tspan><tspan fill="#0288d1">.</tspan><tspan fill="#1a2733">total</tspan><tspan fill="#0288d1">)</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#0288d1">&gt;</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#d84315">1000</tspan></text>
<text x="52" y="356" font-size="14" fill="#90a4ae" text-anchor="end">14</text>
<text x="66" y="356" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">ORDER BY</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#558b2f">revenue</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#7b1fa2">DESC</tspan></text>
<text x="52" y="378" font-size="14" fill="#90a4ae" text-anchor="end">15</text>
<text x="66" y="378" font-size="14" xml:space="preserve"><tspan fill="#7b1fa2">LIMIT</tspan><tspan fill="#2c3e50"> </tspan><tspan fill="#d84315">10</tspan><tspan fill="#0288d1">;</tspan></text>
</svg>